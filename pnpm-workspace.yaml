packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  workerd: true

# Fail the install when a *dependency* declares an engine this machine cannot
# satisfy. It says nothing about the root project's own "engines": pnpm 12
# dropped that check, and neither this nor the .npmrc key it replaced refuses an
# install here any more. What still guards pnpm is the "packageManager" pin.
engineStrict: true

# Most hijacked npm versions are pulled within hours, so an install waits a
# day; our own packages are exempt.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@adrienlcp/*'

publicHoistPattern:
  - '@biomejs/*'
