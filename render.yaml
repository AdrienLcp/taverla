services:
  - type: web
    name: taverla
    runtime: node
    plan: free
    # Rooms live in a Map in one process and sockets stay open for the length of
    # a party, so this deployment must stay a single long-running instance. Do
    # not raise the instance count: two of them would each hold half the rooms
    # and a phone would reach the wrong one.
    numInstances: 1
    healthCheckPath: /api/health
    # A record, not the source: the service reads its commands from the
    # dashboard, so a change here must be made there too (API or UI).
    # No corepack: Render's /usr/bin is read-only, so `corepack enable` dies on
    # EROFS. Render's own pnpm reads `packageManager` and switches to that
    # version by itself, nested script calls included.
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: cd apps/server && node dist/index.mjs
    envVars:
      - key: NODE_VERSION
        value: '26'
      # Relative to the server package, which is where the start command runs.
      - key: SERVE_GAME_FROM
        value: ../game/dist
