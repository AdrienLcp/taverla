services:
  - type: web
    name: taverla
    runtime: node
    plan: free
    # Rooms live in a Map in one process and sockets stay open for the length of
    # a party, so this deployment must stay a single long-running instance. Do
    # not raise the instance count: two of them would each hold half the rooms
    # and a phone would reach the wrong one.
    numInstances: 1
    healthCheckPath: /api/health
    # Render's /usr/bin is read-only, so a bare `corepack enable` dies on EROFS
    # replacing its pnpm. The shims go to a directory of our own instead, and
    # the start command needs no pnpm at all.
    buildCommand: >-
      mkdir -p "$HOME/.corepack-bin" &&
      corepack enable --install-directory "$HOME/.corepack-bin" &&
      export PATH="$HOME/.corepack-bin:$PATH" &&
      pnpm install --frozen-lockfile && pnpm build
    startCommand: cd apps/server && node dist/index.mjs
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: '0'
      # Relative to the server package, which is where the start command runs.
      - key: SERVE_GAME_FROM
        value: ../game/dist
