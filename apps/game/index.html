<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <meta content="#c2410c" name="theme-color" />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <link as="font" crossorigin href="/fonts/archivo-latin.woff2" rel="preload" type="font/woff2" />
    <title>Blind Test</title>
    <!--
      The cascade order lives here, not in a stylesheet, because a layer's
      position is fixed by where its name FIRST appears. Every component
      stylesheet opens with `@layer components`, and the bundler injects them in
      module-graph order — so a single component imported before the global
      sheet would register `components` first and push `reset` after it, which
      is how a reset ends up beating every component rule. Declared in the
      document head, the order cannot depend on the import graph.
    -->
    <style>
      @layer reset, tokens, base, components;
    </style>
  </head>
  <body>
    <!--
      THESIS: the screen is a title card, not a page — one saturated field, one
      idea, replaced wholesale between phases. It refuses the dark dashboard
      with a neon accent that every party-game app ships.
      OWN-WORLD: French TV variety title cards, 1972-81. Six full-bleed fields,
      one per phase (burnt orange, chrome yellow, deep teal, oxblood,
      aubergine, forest). Archivo at width 125 and weight 900, set enormous and
      tight in caps. Hard edges, no glow, no rounded cards; the cover art and
      the QR code are the only rectangles, die-cut white on the field.
      STORY: the room reads the code from four metres, scans it, and from then
      on the screen says exactly one thing at a time.
      FIRST VIEWPORT: burnt-orange field edge to edge. The room code in
      expanded black caps at clamp(4rem, 20vw, 18rem), the QR a white die-cut
      square beside it, the join URL small beneath. "Start" is a hard-edged
      block on the field, bottom left.
      FORM: title card; candidate 3 of the ordered grounded list; seed 189afed2.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
