<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />

    <!--
      The board, in each palette, because it is what a cold load paints before
      React decides anything. They are `--board`: if that token moves, these
      move with it.
    -->
    <meta content="#132f3b" data-scheme="dark" media="(prefers-color-scheme: dark)" name="theme-color" />
    <meta content="#d3ebf3" data-scheme="light" media="(prefers-color-scheme: light)" name="theme-color" />

    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <!-- iOS ignores an SVG icon outright, and a phone is where this is added to a home screen. -->
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />

    <!--
      The page says "the tavern is open" and nothing else; a tab, a search
      result and a link unfurled in a group chat have nobody standing in front
      of the room to explain it, so the explanation lives here instead.
    -->
    <!--
      Every tag below that names a page is rewritten per document by
      `scripts/prerender.ts`, which fails the build if any of them stops
      matching. The copy lives in `presentation/head/document-head.ts` alone:
      the empty values here are filled with its English home page by
      `scripts/shell-head.ts`, so the shell `pnpm dev` and the SPA fallback
      serve says what the prerendered home says. The font preloads, the
      `hreflang` alternates, `og:locale:alternate` and the JSON-LD are written
      by the prerender only.
    -->
    <title></title>
    <meta content="" name="description" />
    <!--
      Absolute, because most scrapers refuse to resolve a relative one. Both
      this and `og:url` are the deployment's origin: they change the day a
      custom domain does, and nothing else in the app hardcodes a host.
    -->
    <link href="https://taverla.adrienlcp.com/" rel="canonical" />

    <meta content="website" property="og:type" />
    <meta content="Taverla" property="og:site_name" />
    <meta content="" property="og:title" />
    <meta content="" property="og:description" />
    <meta content="https://taverla.adrienlcp.com/" property="og:url" />
    <meta content="https://taverla.adrienlcp.com/og.png" property="og:image" />
    <meta content="1200" property="og:image:width" />
    <meta content="630" property="og:image:height" />
    <meta content="" property="og:image:alt" />
    <meta content="" property="og:locale" />
    <meta content="summary_large_image" name="twitter:card" />
    <!--
      The cascade order lives here, not in a stylesheet, because a layer's
      position is fixed by where its name FIRST appears. Every component
      stylesheet opens with `@layer components`, and the bundler injects them in
      module-graph order — so a single component imported before the global
      sheet would register `components` first and push `reset` after it, which
      is how a reset ends up beating every component rule. Declared in the
      document head, the order cannot depend on the import graph.
    -->
    <style>
      @layer reset, tokens, base, components;
    </style>
    <script data-site="taverla" defer src="https://analytics.adrienlcp.com/tracker.js"></script>
  </head>
  <body>
    <!--
      THESIS: Taverla is a shelf of game boxes on a table; every screen is a
      printed piece from that box, never an app panel of rounded cards on a
      dark ground.
      OWN-WORLD: a matte printed board, pale sky by day and slate blue by
      evening; four inks (coral, saffron, sky, leaf) on die-cut answer tiles
      with a 3px chipboard edge, sprue nubs and a shape each; paper question
      cards; eight pawns; a score track around the console's edge, inked by
      the phase; the room code on a saffron token. Bricolage Grotesque
      condensed for what is printed on the box, Atkinson Hyperlegible Next for
      what is read.
      STORY: the visitor sees five boxes and a lid promising seconds-to-play;
      the room sees its pawns move along the track; a player taps a tile like
      taking a token.
      FIRST VIEWPORT: the lid left (wordmark, two promises, the coral "create a
      room" token), five stacked spines right.
      FORM: game-box production system, 1st of 3; seed key 0a5a42fb.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
