<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />

    <!--
      The two lobby grounds, because the lobby is what a cold load paints
      before React decides anything. They are `--field-lobby` in each palette:
      if that token moves, these move with it.
    -->
    <meta content="#a8330d" data-scheme="dark" media="(prefers-color-scheme: dark)" name="theme-color" />
    <meta content="#ff7a3d" data-scheme="light" media="(prefers-color-scheme: light)" name="theme-color" />

    <!--
      `_tokens.sass` answers `prefers-color-scheme` on its own, so only an
      explicit override needs stamping — and `ThemeProvider` stamps it from an
      effect, which is a second and a half after the first paint. That gap is
      the flash. The two meta tags above are media-scoped to the system
      preference for the same reason, so an override has to move them too or
      the browser's own chrome keeps the palette the page just left.

      Each tag says which scheme it is, and `themeColorMediaFor` in
      `helpers/theme.ts` says what to do about it — the same rule, reached
      twice, because this has to answer before a module is downloaded and
      `ThemeProvider` has to answer again when the menu changes the theme an
      hour later. Reading the media query back out of the tag is what this
      cannot do: the first override overwrites it, and `'system'` then has
      nothing to restore.
    -->
    <script>
      try {
        const theme = localStorage.getItem('taverla:theme')

        if (theme === 'dark' || theme === 'light') {
          document.documentElement.dataset.theme = theme

          for (const meta of document.querySelectorAll('meta[name="theme-color"][data-scheme]')) {
            meta.media = meta.dataset.scheme === theme ? 'all' : 'not all'
          }
        }
      } catch {}
    </script>

    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <!-- iOS ignores an SVG icon outright, and a phone is where this is added to a home screen. -->
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
    <link as="font" crossorigin href="/fonts/archivo-latin.woff2" rel="preload" type="font/woff2" />

    <!--
      The page says "the tavern is open" and nothing else; a tab, a search
      result and a link unfurled in a group chat have nobody standing in front
      of the room to explain it, so the explanation lives here instead.
    -->
    <!--
      This head is the English home page's, and every tag below that names a
      page is rewritten per document by `scripts/prerender.ts` — which fails the
      build if any of them stops matching. What is served from here unrewritten
      is `pnpm dev` and the SPA fallback, so it stays a valid standalone page.
      The copy itself lives in `presentation/head/document-head.ts`, in both
      languages; these two must be its `en.home` entry word for word.
    -->
    <title>Taverla — party games for one screen and the whole room</title>
    <meta
      content="One screen runs the game, everyone joins by scanning a QR code or typing the room code — no install, no account. Blind test, Buzzer, Quiz, Reflex and Slate."
      name="description"
    />
    <!--
      Absolute, because most scrapers refuse to resolve a relative one. Both
      this and `og:url` are the deployment's origin: they change the day a
      custom domain does, and nothing else in the app hardcodes a host.
    -->
    <link href="https://taverla.onrender.com/" rel="canonical" />

    <meta content="website" property="og:type" />
    <meta content="Taverla" property="og:site_name" />
    <meta content="Taverla — party games for one screen and the whole room" property="og:title" />
    <meta
      content="One screen runs the game, everyone joins by scanning a QR code or typing the room code — no install, no account. Blind test, Buzzer, Quiz, Reflex and Slate."
      property="og:description"
    />
    <meta content="https://taverla.onrender.com/" property="og:url" />
    <meta content="https://taverla.onrender.com/og.png" property="og:image" />
    <meta content="1200" property="og:image:width" />
    <meta content="630" property="og:image:height" />
    <meta content="The Taverla wordmark on the lobby's burnt-orange field." property="og:image:alt" />
    <meta content="en_US" property="og:locale" />
    <meta content="fr_FR" property="og:locale:alternate" />
    <meta content="summary_large_image" name="twitter:card" />
    <!--
      The cascade order lives here, not in a stylesheet, because a layer's
      position is fixed by where its name FIRST appears. Every component
      stylesheet opens with `@layer components`, and the bundler injects them in
      module-graph order — so a single component imported before the global
      sheet would register `components` first and push `reset` after it, which
      is how a reset ends up beating every component rule. Declared in the
      document head, the order cannot depend on the import graph.
    -->
    <style>
      @layer reset, tokens, base, components;
    </style>
  </head>
  <body>
    <!--
      THESIS: the screen is a title card, not a page — one saturated field, one
      idea, replaced wholesale between phases. It refuses the dark dashboard
      with a neon accent that every party-game app ships.
      OWN-WORLD: French TV variety title cards, 1972-81. Six full-bleed fields,
      one per phase (burnt orange, chrome yellow, deep teal, oxblood,
      aubergine, forest). Archivo at width 125 and weight 900, set enormous and
      tight in caps. Hard edges, no glow, no rounded cards; the cover art and
      the QR code are the only rectangles, die-cut white on the field.
      STORY: the room reads the code from four metres, scans it, and from then
      on the screen says exactly one thing at a time.
      FIRST VIEWPORT: burnt-orange field edge to edge. The room code in
      expanded black caps at clamp(4rem, 20vw, 18rem), the QR a white die-cut
      square beside it, the join URL small beneath. "Start" is a hard-edged
      block on the field, bottom left.
      FORM: title card; candidate 3 of the ordered grounded list; seed 189afed2.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
